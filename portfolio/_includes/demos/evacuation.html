<div class="demo">
  <p class="demo-cap">Click anywhere in the floor plan to place someone. Compare how much of the building each algorithm searches, then block the corridor with a crowd.</p>
  <canvas id="evacCanvas" class="cv" style="height:230px;cursor:pointer" aria-label="Floor plan pathfinding"></canvas>
  <div class="ctrl">
    <div class="seg" id="evacSeg" role="group" aria-label="Algorithm">
      <button type="button" data-v="dijkstra" aria-pressed="true">Dijkstra</button>
      <button type="button" data-v="astar" aria-pressed="false">A*</button>
    </div>
    <button class="btn" type="button" id="evacCrowd">Add crowd</button>
    <button class="btn" type="button" id="evacClear">Clear crowds</button>
  </div>
  <div class="stats" id="evacStats"></div>
  <p class="src">Simplified floor plan. Crowded cells cost more to cross, using the project’s weighting w = w₀(1 + 5ρ).</p>
</div>
<script src="{{ '/assets/js/demos/evacuation.js' | relative_url }}" defer></script>
