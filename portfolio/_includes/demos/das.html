<div class="demo">
  <p class="demo-cap">Pick a road user. Pedestrians barely show up; turn on zoom and the smoothing filter to find their footsteps.</p>
  <canvas id="dasCanvas" class="cv" style="height:190px" aria-label="Simulated DAS strain signal"></canvas>
  <div class="ctrl">
    <div class="seg" id="dasSeg" role="group" aria-label="Road user">
      <button type="button" data-v="car" aria-pressed="true">Car</button>
      <button type="button" data-v="moto" aria-pressed="false">Motorbike</button>
      <button type="button" data-v="bike" aria-pressed="false">Bicycle</button>
      <button type="button" data-v="ped" aria-pressed="false">Pedestrian</button>
    </div>
    <label><input type="checkbox" id="dasZoom"> Zoom</label>
    <label><input type="checkbox" id="dasFilt"> Smoothing filter</label>
  </div>
  <div class="stats" id="dasStats"></div>
  <p class="src">Simplified signal that illustrates the idea; not research data.</p>
</div>
<script src="{{ '/assets/js/demos/das.js' | relative_url }}" defer></script>
