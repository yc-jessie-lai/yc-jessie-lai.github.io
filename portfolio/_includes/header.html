<header class="site-head">
  <div class="wrap head-in">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.url == "/projects/" or page.collection == "projects" %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.url == "/cv/" %} aria-current="page"{% endif %}>CV</a>
    </nav>
  </div>
</header>
